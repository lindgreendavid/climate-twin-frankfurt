[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "climate_twin_frankfurt"
version = "0.1.0"
description = "A reproducible reanalysis of real DWD station records: the Frankfurt urban heat island, measured urban-vs-rural, with uncertainty"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "David Lindgreen" }]
keywords = ["urban-heat-island", "climate-data", "dwd", "frankfurt", "reproducible-research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy>=1.26,<2.3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.13,<3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
climate-twin-frankfurt = "climate_twin_frankfurt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_twin_frankfurt"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=climate_twin_frankfurt --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["climate_twin_frankfurt"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
